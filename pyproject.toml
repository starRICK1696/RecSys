[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prob-ae-recsys"
version = "0.1.0"
description = "Probabilistic Weighting Autoencoder experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.1", "matplotlib>=3.7", "typing-extensions>=4.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
